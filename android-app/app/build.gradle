plugins { id 'com.android.application' }
android {
    namespace 'com.zhicuotupu.edge'
    compileSdk 34
    defaultConfig {
        applicationId "com.zhicuotupu.edge"
        minSdk 28; targetSdk 34; versionCode 2; versionName "1.1"
        ndk { abiFilters 'arm64-v8a' }
    }
}
dependencies {
    implementation project(':llm-sdk')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
}
