services:
  - type: web
    name: zhicuotupu-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: VIVO_API_BASE_URL
        value: https://api-ai.vivo.com.cn/v1
      - key: VIVO_MODEL_NAME
        value: Doubao-Seed-2.0-mini
      - key: VIVO_VISION_MODEL_NAME
        value: Volc-DeepSeek-V3.2
      - key: VIVO_USE_MOCK
        value: false
      - key: VIVO_TIMEOUT_SECONDS
        value: 120
      - key: CORS_ORIGINS
        value: https://your-frontend-domain.netlify.app
